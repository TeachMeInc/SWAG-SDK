name: HTML5 - Daily Production Deployment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --verbose
        working-directory: ./platforms/html5

      - name: Build project
        run: npm run build
        working-directory: ./platforms/html5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCP Cloud Storage
        run: gcloud storage rsync --recursive ./platforms/html5/dist gs://swag-sdk/v5/dist
      
      - name: Clear Cloudflare Cache
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" \
                --data '{"files":["https://swagapi.shockwave.com/v5/dist/swag-api.js", "https://swagapi.shockwave.com/v5/dist/swag-api.css"]}'
